; =============================================================================
; Tally32  -  Statusanzeige fuer den Arbeitsplatz: IM GESPRAECH / BESETZT (frei ab) / FREI.
; Den Status liefert der Agent auf dem Computer (agent/tally_agent.py) per USB.
; Einzige App, startet direkt nach dem Einschalten.
; =============================================================================
[platformio]
default_envs = guition-p4

; -----------------------------------------------------------------------------
; GUITION JC1060P470C: ESP32-P4 (rev. v1.3) + ESP32-C6 (WLAN), 16 MB Flash,
; 32 MB PSRAM, 7" IPS 1024x600 an MIPI-DSI (JD9165), Touch GT911.
; USB: Betrieb und Flashen ueber USB2 "Full Speed" (USB-Serial/JTAG des P4, im Gehaeuse
; die obere Buchse). USB1 (CH340) liegt im Gehaeuse innen, USB3 (OTG) bleibt ungenutzt.
; Flashen: pio run -t upload --upload-port <port>
; -----------------------------------------------------------------------------
[env:guition-p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-p4                    ; Chip vor rev.300 (ES), sonst esp32-p4_r3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1           ; Serial = USB-Serial/JTAG (Buchse USB2), nicht UART0
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lovyan03/LovyanGFX@^1.2.0

; -----------------------------------------------------------------------------
; GUITION JC8012P4A1C: ESP32-P4 Revision v3.x + ESP32-C6, 16 MB Flash, 32 MB PSRAM,
; 10,1" IPS 800x1280 (quer betrieben) an MIPI-DSI (JD9365), Touch GSL3680.
; Pins weitgehend wie JC1060P470C, Unterschiede in lgfx_jc8012.h.
; -----------------------------------------------------------------------------
[env:guition-p4-10]
extends = env:guition-p4
board = esp32-p4_r3                 ; Chip-Revision v3.2 (mit esptool gemessen)
build_flags =
    ${env:guition-p4.build_flags}
    -D BOARD_JC8012
